<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PRECEDENT · v5 — Spatial Intelligence + Super Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600&family=Inter+Tight:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--ink:#131210;--paper:#F2EFE8;--soft:#EAE6DC;--line:#131210;--ls:rgba(19,18,16,0.14);--acc:#C5341E;--olive:#5A5638;--sand:#C8B998;--teal:#1B6B5A;--gold:#A07B2A;--blue:#1A4B8C;--df:'Fraunces',serif;--bd:'Inter Tight',sans-serif;--mn:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--bd);font-size:14px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased;background-image:radial-gradient(ellipse at top,rgba(197,52,30,0.04),transparent 60%)}

/* ── HEADER ── */
header{border-bottom:1px solid var(--line);padding:13px 28px;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;position:sticky;top:0;z-index:100;background:var(--paper)}
.logo{font-family:var(--df);font-weight:600;font-size:22px;letter-spacing:-0.04em;line-height:1}.logo em{font-style:italic;color:var(--acc)}
.logo-sub{font-family:var(--mn);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--olive);margin-top:2px}
nav{display:flex;gap:3px}
.nb{font-family:var(--mn);font-size:9px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;background:none;border:1px solid transparent;color:var(--ink);padding:5px 10px;transition:all .15s}.nb:hover{border-color:var(--ls)}.nb.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.nb.match-nb{background:var(--acc);color:var(--paper);border-color:var(--acc)}
.ha{display:flex;gap:7px}
.btn{font-family:var(--mn);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border:1px solid;cursor:pointer;transition:all .15s;white-space:nowrap}
.bi{background:var(--ink);color:var(--paper);border-color:var(--ink)}.bi:hover{background:var(--acc);border-color:var(--acc)}
.bg{background:transparent;color:var(--ink);border-color:var(--ink)}.bg:hover{background:var(--ink);color:var(--paper)}
.bt{background:var(--teal);color:var(--paper);border-color:var(--teal)}.bt:hover{opacity:.85}
.bsm{padding:4px 9px;font-size:8.5px}

/* ── HERO ── */
.hero{padding:40px 28px 24px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:40px;align-items:end}
.ht{font-family:var(--df);font-size:clamp(36px,5vw,76px);line-height:.92;font-weight:400;letter-spacing:-.04em}.ht em{font-style:italic;color:var(--acc)}
.hstats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;border-top:1px solid var(--line);padding-top:12px;min-width:480px}
.sn{font-family:var(--df);font-size:30px;font-weight:500;line-height:1;letter-spacing:-.02em}
.sl{font-family:var(--mn);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--olive);margin-top:4px}

/* ── CONTROLS ── */
.ctrl{border-bottom:1px solid var(--line);padding:10px 28px;display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;background:var(--soft)}
.sw{position:relative}
.srch{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);padding:7px 0 7px 20px;font-family:var(--df);font-size:16px;font-style:italic;color:var(--ink);outline:none}.srch::placeholder{color:rgba(19,18,16,.35)}
.sic{position:absolute;left:0;top:50%;transform:translateY(-50%);color:var(--olive)}
.fsl{font-family:var(--mn);font-size:9px;letter-spacing:.1em;text-transform:uppercase;background:transparent;color:var(--ink);border:1px solid var(--line);padding:6px 9px;cursor:pointer}
.vtg{display:flex;border:1px solid var(--line)}
.vb{background:transparent;border:none;padding:6px 9px;cursor:pointer;color:var(--ink);font-family:var(--mn);font-size:9px;letter-spacing:.1em;text-transform:uppercase}.vb.on{background:var(--ink);color:var(--paper)}

/* ── FILTER BAR ── */
.fb{padding:8px 28px;border-bottom:1px solid var(--ls);display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:38px}
.fbl{font-family:var(--mn);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--olive)}
.chip{font-family:var(--mn);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:2px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}.chip:hover{background:var(--acc)}
.chip-t{background:var(--teal)}.chip-t:hover{background:var(--acc)}.fsp{flex:1}

/* ── GRID ── */
.gv{display:grid;grid-template-columns:repeat(12,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.card{background:var(--paper);grid-column:span 4;padding:18px;cursor:pointer;position:relative;transition:background .18s;min-height:330px;display:flex;flex-direction:column}
.card:hover{background:var(--soft)}.card.sel{background:#EFF0E4;outline:2px solid var(--teal)}
.ck{position:absolute;top:12px;right:12px;width:20px;height:20px;border:1.5px solid var(--ls);background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;z-index:2}.card.sel .ck{background:var(--teal);color:var(--paper);border-color:var(--teal)}
.cn{font-family:var(--mn);font-size:9px;letter-spacing:.12em;color:var(--olive);margin-bottom:12px}
.ci{width:100%;height:150px;background:var(--sand);margin-bottom:12px;overflow:hidden;position:relative}.ci img{width:100%;height:100%;object-fit:cover}
.cnm{font-family:var(--df);font-size:21px;font-weight:500;line-height:1.05;letter-spacing:-.02em;margin-bottom:5px}
.clc{font-family:var(--mn);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--olive);margin-bottom:8px}
.pmini{margin-top:6px;border-top:1px solid var(--ls);padding-top:8px}
.pmr{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.pml{font-family:var(--mn);font-size:7.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--olive);width:58px;flex-shrink:0}
.pmb{height:4px;border-radius:2px;background:var(--acc);flex:1;max-width:90px}
.pmv{font-family:var(--mn);font-size:7.5px;color:var(--olive);white-space:nowrap}
.ctg{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto;padding-top:8px}
.tg{font-family:var(--mn);font-size:8px;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--ls);padding:1px 5px;color:var(--olive)}.tg.a{border-color:var(--acc);color:var(--acc)}

/* ── LIST ── */
.lv{padding:0 28px}
.lh,.lr{display:grid;grid-template-columns:44px 1.3fr .7fr .7fr 70px 80px 70px;gap:14px;padding:11px 0;border-bottom:1px solid var(--ls);align-items:center}
.lh{font-family:var(--mn);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--olive);border-bottom-color:var(--line)}
.lr{cursor:pointer;transition:background .15s}.lr:hover{background:var(--soft);margin:0 -28px;padding:11px 28px}.lr.sel{background:#EFF0E4}
.lnm{font-family:var(--df);font-size:15px;font-weight:500;letter-spacing:-.01em}
.lmt{font-family:var(--mn);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--olive)}

/* ── COMPARE BAR ── */
.cmpbar{position:fixed;bottom:0;left:0;right:0;z-index:150;background:var(--ink);color:var(--paper);padding:11px 28px;display:flex;align-items:center;gap:14px;transform:translateY(100%);transition:transform .3s ease;border-top:2px solid var(--acc)}
.cmpbar.vis{transform:translateY(0)}
.cmbl{font-family:var(--mn);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--sand)}
.cmbt{display:flex;gap:7px;flex:1}
.cmbi{background:rgba(255,255,255,.1);padding:4px 9px;font-family:var(--df);font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
.cmbx{font-family:var(--mn);font-size:9px;cursor:pointer;color:var(--sand)}.cmbx:hover{color:var(--acc)}

/* ── MODAL ── */
.mover{position:fixed;inset:0;background:rgba(19,18,16,.88);z-index:200;display:none;overflow-y:auto;padding:18px}.mover.open{display:block}
.modal{max-width:1140px;margin:0 auto;background:var(--paper);position:relative;min-height:calc(100vh - 36px)}
.mcl{position:absolute;top:14px;right:14px;width:32px;height:32px;background:var(--ink);color:var(--paper);border:none;cursor:pointer;font-family:var(--mn);font-size:11px;z-index:10}.mcl:hover{background:var(--acc)}
.mh{padding:32px 32px 20px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:2fr 1fr;gap:28px;align-items:end}
.mnum{font-family:var(--mn);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--olive);margin-bottom:10px}
.mtl{font-family:var(--df);font-size:clamp(28px,3.5vw,48px);line-height:.95;font-weight:500;letter-spacing:-.03em;margin-bottom:7px}.mtl em{font-style:italic;color:var(--acc)}
.msb{font-family:var(--mn);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--olive)}
.qr{border-top:1px solid var(--ls);padding-top:7px;margin-bottom:7px}
.ql{font-family:var(--mn);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--olive);margin-bottom:2px}
.qv{font-family:var(--df);font-size:15px;font-weight:500}
.mbd{padding:32px;display:grid;grid-template-columns:2fr 1fr;gap:40px}
.sec{padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--ls)}.sec:last-child{border-bottom:none}
.sh{font-family:var(--mn);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.shn{color:var(--acc);margin-right:5px}
.stx{font-size:13px;line-height:1.65}
.sl2{list-style:none;padding:0}.sl2 li{padding:5px 0 5px 20px;border-bottom:1px solid var(--ls);position:relative;font-size:12px;line-height:1.5}.sl2 li:before{content:attr(data-n);position:absolute;left:0;font-family:var(--mn);font-size:8.5px;color:var(--acc);font-weight:600}
.pcg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pch{font-family:var(--mn);font-size:8px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}.pch.p{color:var(--teal)}.pch.c{color:var(--acc)}
.pcl{list-style:none;padding:0}.pcl li{padding:4px 0 4px 12px;border-bottom:1px solid var(--ls);position:relative;font-size:12px}.pcl li:before{content:'+';position:absolute;left:0;font-family:var(--mn);color:var(--teal)}.pcl.m li:before{content:'−';color:var(--acc)}
.rel{background:var(--ink);color:var(--paper);padding:18px;margin:0 -32px -32px;grid-column:1/-1}
.rel .sh{color:var(--paper);border-bottom-color:rgba(242,239,232,.2)}
.rlt{font-family:var(--df);font-size:17px;line-height:1.4;font-style:italic}
.mit{padding:7px 0;border-bottom:1px solid var(--ls)}.mit:first-child{padding-top:0}
.mil{font-family:var(--mn);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--olive);margin-bottom:2px}.miv{font-size:12px;line-height:1.5}
.tbg{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.td{font-family:var(--mn);font-size:8px;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--line);padding:2px 5px}
.el{display:block;padding:6px 9px;border:1px solid var(--line);margin-bottom:3px;text-decoration:none;color:var(--ink);font-family:var(--mn);font-size:8.5px;letter-spacing:.05em;transition:all .15s}.el:hover{background:var(--ink);color:var(--paper)}.el span{color:var(--olive);float:right}.el:hover span{color:var(--paper)}
.mac{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}

/* ── PROG PANEL ── */
.pp{background:var(--soft);border:1px solid var(--ls);margin-bottom:18px}
.pph{padding:10px 14px;border-bottom:1px solid var(--ls);font-family:var(--mn);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--olive);display:flex;justify-content:space-between}
.ppg{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.ppc{padding:9px 12px;border-right:1px solid var(--ls);border-bottom:1px solid var(--ls)}.ppc:nth-child(3n){border-right:none}
.ppf{font-family:var(--mn);font-size:7.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--olive);margin-bottom:2px}
.ppv{font-family:var(--df);font-size:16px;font-weight:500;letter-spacing:-.01em}
.ppu{font-family:var(--mn);font-size:7.5px;color:var(--olive)}
.ppbr{height:3px;background:var(--paper);border-radius:2px;margin-top:3px}
.ppbf{height:3px;border-radius:2px}

/* ── COMMENTS ── */
.cmts{margin-top:14px;padding-top:14px;border-top:1px solid var(--ls)}
.cmth{font-family:var(--mn);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--olive);margin-bottom:10px}
.cmt{padding:7px 0;border-bottom:1px solid var(--ls)}
.cmtm{font-family:var(--mn);font-size:7.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--olive);margin-bottom:2px;display:flex;gap:7px}.cmtd{cursor:pointer;color:var(--acc);margin-left:auto}
.cmtt{font-size:12px;line-height:1.5}
.cmtf{display:grid;grid-template-columns:1fr auto;gap:5px;margin-top:8px}
.cmti{background:var(--soft);border:1px solid var(--ls);padding:6px 8px;font-family:var(--bd);font-size:12px;color:var(--ink);outline:none;resize:none}.cmti:focus{border-color:var(--ink)}
.cmtn{background:var(--soft);border:1px solid var(--ls);padding:4px 8px;font-family:var(--mn);font-size:8.5px;color:var(--ink);outline:none;width:100px}.cmtn:focus{border-color:var(--ink)}

/* ── COLLECTIONS ── */
.clov{position:fixed;inset:0;background:rgba(19,18,16,.7);z-index:300;display:none}.clov.open{display:flex;align-items:flex-start;justify-content:flex-end}
.clp{background:var(--paper);width:340px;height:100vh;overflow-y:auto;border-left:1px solid var(--line)}
.clh{padding:18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--paper);z-index:2}
.clt{font-family:var(--df);font-size:22px;font-weight:500;letter-spacing:-.02em}.clt em{font-style:italic;color:var(--acc)}
.clb{padding:14px 18px}
.clcr{display:grid;grid-template-columns:1fr auto;gap:5px;margin-bottom:14px}
.clin{background:var(--soft);border:1px solid var(--ls);padding:6px 8px;font-family:var(--bd);font-size:12px;color:var(--ink);outline:none}.clin:focus{border-color:var(--ink)}
.clit{border:1px solid var(--ls);margin-bottom:5px}.clit.act{border-color:var(--teal);background:rgba(27,107,90,.04)}
.clih{padding:9px 11px;display:flex;align-items:center;gap:7px;cursor:pointer}
.clin2{font-family:var(--df);font-size:14px;font-weight:500;letter-spacing:-.01em;flex:1}
.clct{font-family:var(--mn);font-size:7.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--olive)}
.clx{font-family:var(--mn);font-size:8.5px;color:var(--acc);cursor:pointer;padding:2px 4px}.clx:hover{background:var(--acc);color:var(--paper)}
.cls{padding:0 11px 8px;display:flex;flex-wrap:wrap;gap:3px}
.clst{font-family:var(--mn);font-size:7.5px;letter-spacing:.07em;text-transform:uppercase;background:var(--soft);border:1px solid var(--ls);padding:2px 6px;cursor:pointer}.clst:hover{background:var(--acc);color:var(--paper);border-color:var(--acc)}
.clad{padding:0 11px 11px}.cladh{font-family:var(--mn);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--olive);margin-bottom:4px}
.cladr{display:flex;align-items:center;gap:5px;padding:3px 0;border-bottom:1px solid var(--ls);cursor:pointer}.cladr:hover{background:var(--soft)}
.cladcb{width:11px;height:11px;border:1px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:7px}.cladcb.ck{background:var(--teal);color:var(--paper);border-color:var(--teal)}.cladn{font-size:11px}

/* ── FORM ── */
.fmov{max-width:860px}
.fmb{padding:24px 32px}
.fg{margin-bottom:13px}.fr{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.fl{display:block;font-family:var(--mn);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--olive);margin-bottom:3px}.fl .rq{color:var(--acc)}
.fi,.fse,.fta{width:100%;background:var(--soft);border:1px solid var(--ls);padding:7px 9px;font-family:var(--bd);font-size:13px;color:var(--ink);transition:border-color .15s}.fi:focus,.fse:focus,.fta:focus{outline:none;border-color:var(--ink);background:var(--paper)}.fta{resize:vertical;min-height:64px}
.fh{font-family:var(--mn);font-size:7.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--olive);margin-top:2px}
.fsc{border-top:1px solid var(--ls);padding-top:13px;margin-top:16px}
.fsch{font-family:var(--mn);font-size:9px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}.fsch span{color:var(--acc);margin-right:5px}
.fmac{display:flex;gap:7px;justify-content:flex-end;border-top:1px solid var(--line);padding:14px 32px;background:var(--soft);margin:18px -32px -24px}

/* ── AUTO-FETCH ── */
.af{background:var(--soft);border:1px solid var(--ls);padding:14px;margin-bottom:16px}
.aft{font-family:var(--mn);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;gap:6px}.aft span{background:var(--teal);color:var(--paper);padding:2px 6px;font-size:7.5px}
.afr{display:grid;grid-template-columns:1fr auto;gap:6px}
.afin{background:var(--paper);border:1px solid var(--ls);padding:7px 9px;font-family:var(--mn);font-size:10px;color:var(--ink);outline:none;width:100%}.afin:focus{border-color:var(--teal)}
.afst{margin-top:5px;font-family:var(--mn);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase}.afst.ld{color:var(--teal)}.afst.ok{color:var(--teal)}.afst.er{color:var(--acc)}

/* ── IMAGE UPLOAD ── */
.iup{margin-bottom:14px}
.ipvs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px}.ipv{width:68px;height:50px;object-fit:cover;border:1px solid var(--ls);cursor:pointer}
.idr{border:1.5px dashed var(--ls);padding:14px;text-align:center;cursor:pointer;background:var(--soft)}.idr.drag{border-color:var(--teal);background:rgba(27,107,90,.05)}
.idl{font-family:var(--mn);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--olive)}.ids{font-family:var(--mn);font-size:7.5px;color:var(--sand);margin-top:2px;letter-spacing:.05em;text-transform:uppercase}

/* ── IMAGE GALLERY ── */
.galmain{width:100%;height:280px;object-fit:cover;display:block}
.galstrip{display:flex;gap:5px;overflow-x:auto;padding:10px 32px;background:var(--soft)}
.galthumb{width:90px;height:60px;object-fit:cover;flex-shrink:0;cursor:pointer;border:2px solid transparent;transition:border-color .15s}.galthumb.act{border-color:var(--ink)}.galthumb:hover{border-color:var(--acc)}
.galnav{position:absolute;top:50%;transform:translateY(-50%);background:var(--ink);color:var(--paper);border:none;width:30px;height:30px;cursor:pointer;font-family:var(--mn)}.galnav:hover{background:var(--acc)}.galnav.pv{left:10px}.galnav.nx{right:10px}

/* ── COMPARE MODAL ── */
.cmpm{max-width:1380px}
.cmph{padding:22px 28px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px}
.cmpht{font-family:var(--df);font-size:32px;font-weight:400;letter-spacing:-.03em;flex:1}.cmpht em{font-style:italic;color:var(--acc)}
.cmpc{background:var(--paper);padding:20px}
.cmpn{font-family:var(--df);font-size:17px;font-weight:500;letter-spacing:-.02em;margin-bottom:2px}
.cmps{font-family:var(--mn);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--olive);margin-bottom:12px}
