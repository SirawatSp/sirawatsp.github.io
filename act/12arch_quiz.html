<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สอบสถาปัตยกรรม 150 ข้อ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--surface:#161616;--card:#1e1e1e;
  --gold:#c9a84c;--gold2:#e8c97a;--text:#e8e0d0;
  --muted:#7a7060;--green:#4caf7a;--red:#e05050;
  --border:#2a2820;
}
body{background:var(--bg);color:var(--text);font-family:'Sarabun',sans-serif;min-height:100vh}
#app{max-width:800px;margin:0 auto;padding:20px}

/* SPLASH */
#splash{text-align:center;padding:60px 20px}
#splash h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,5vw,3.5rem);color:var(--gold);line-height:1.2;margin-bottom:12px}
#splash p{color:var(--muted);font-size:1.05rem;margin-bottom:40px}
.btn-start{background:var(--gold);color:#0d0d0d;border:none;padding:16px 48px;font-size:1.1rem;font-family:'Sarabun',sans-serif;font-weight:700;cursor:pointer;letter-spacing:.05em;transition:.2s}
.btn-start:hover{background:var(--gold2)}
.badge{display:inline-block;border:1px solid var(--gold);color:var(--gold);font-size:.8rem;padding:4px 12px;letter-spacing:.1em;margin-bottom:24px}

/* QUIZ */
#quiz{display:none}
.progress-bar{height:3px;background:var(--border);margin-bottom:24px;position:relative}
.progress-fill{height:100%;background:var(--gold);transition:width .4s}
.meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:20px}
.q-num{font-size:.8rem;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.q-text{font-size:1.1rem;line-height:1.7;color:var(--text);margin-bottom:24px;font-weight:600}
.choices{display:grid;gap:10px}
.choice{background:var(--card);border:1px solid var(--border);padding:14px 18px;cursor:pointer;font-size:.95rem;font-family:'Sarabun',sans-serif;color:var(--text);text-align:left;transition:.15s;display:flex;gap:12px;align-items:flex-start}
.choice:hover:not(.locked){border-color:var(--gold);color:var(--gold2)}
.choice.correct{border-color:var(--green);background:rgba(76,175,122,.12);color:var(--green)}
.choice.wrong{border-color:var(--red);background:rgba(224,80,80,.1);color:var(--red)}
.choice.locked{cursor:default}
.choice-label{font-weight:700;min-width:22px;font-size:.85rem;opacity:.7}
.feedback{margin-top:16px;padding:14px;background:var(--surface);border-left:3px solid var(--gold);font-size:.9rem;color:var(--muted);display:none;line-height:1.7}
.btn-next{margin-top:20px;background:transparent;border:1px solid var(--gold);color:var(--gold);padding:12px 36px;font-family:'Sarabun',sans-serif;font-size:.95rem;cursor:pointer;display:none;transition:.2s}
.btn-next:hover{background:var(--gold);color:#0d0d0d}

/* RESULT */
#result{display:none;text-align:center;padding:40px 20px}
.score-ring{width:160px;height:160px;margin:0 auto 24px;position:relative}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .ring-bg{fill:none;stroke:var(--border);stroke-width:10}
.score-ring .ring-fill{fill:none;stroke:var(--gold);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s}
.score-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2rem;font-weight:700;color:var(--gold)}
.result-title{font-family:'Playfair Display',serif;font-size:2rem;color:var(--gold);margin-bottom:12px}
.result-msg{font-size:1rem;color:var(--muted);margin-bottom:32px;line-height:1.8}
.result-pass .result-title{color:var(--gold2)}
.btn-retry{background:var(--gold);color:#0d0d0d;border:none;padding:14px 40px;font-size:1rem;font-family:'Sarabun',sans-serif;font-weight:700;cursor:pointer;transition:.2s;margin:8px}
.btn-retry:hover{background:var(--gold2)}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.s-card{background:var(--card);border:1px solid var(--border);padding:16px;text-align:center}
.s-num{font-size:1.8rem;font-weight:700;color:var(--gold)}
.s-label{font-size:.75rem;color:var(--muted);margin-top:4px}
.shirt-badge{font-size:3rem;margin-bottom:12px}
</style>
</head>
<body>
<div id="app">
  <div id="splash">
    <div class="badge">ข้อสอบสถาปัตยกรรม · 150 ข้อ</div>
    <h1>ความรู้ทาง<br>สถาปัตยกรรม</h1>
    <p>ครอบคลุมทฤษฎี · วัสดุ · โครงสร้าง · ระบบอาคาร<br>ทดสอบความพร้อมก่อนสอบจริง</p>
    <button class="btn-start" onclick="startQuiz()">เริ่มทำข้อสอบ →</button>
  </div>

  <div id="quiz">
    <div class="progress-bar"><div class="progress-fill" id="pbar"></div></div>
    <div class="meta">
      <span id="qcount">ข้อ 1 / 150</span>
      <span id="scoretrack">คะแนน: 0</span>
    </div>
    <div class="q-num" id="qnum"></div>
    <div class="q-text" id="qtext"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
    <button class="btn-next" id="btnNext" onclick="nextQ()">ข้อถัดไป →</button>
  </div>

  <div id="result">
    <div class="score-ring">
      <svg width="160" height="160"><circle class="ring-bg" cx="80" cy="80" r="70"/><circle class="ring-fill" id="ringFill" cx="80" cy="80" r="70" stroke-dasharray="439.8" stroke-dashoffset="439.8"/></svg>
      <div class="score-text" id="scoreText">0%</div>
    </div>
    <div id="resultContent"></div>
    <div class="summary-grid">
      <div class="s-card"><div class="s-num" id="sCorrect">0</div><div class="s-label">ข้อถูก</div></div>
      <div class="s-card"><div class="s-num" id="sWrong">0</div><div class="s-label">ข้อผิด</div></div>
      <div class="s-card"><div class="s-num" id="sPct">0%</div><div class="s-label">คะแนน</div></div>
    </div>
    <button class="btn-retry" onclick="startQuiz()">ทำใหม่อีกครั้ง</button>
    <button class="btn-retry" style="background:transparent;border:1px solid var(--gold);color:var(--gold)" onclick="reviewWrong()">ดูข้อที่ผิด</button>
  </div>
</div>

<script>
const Q=[
// หมวด: แสงแดด / ภูมิอากาศ
{q:"ประเทศไทยมีแดดอ้อมใต้นานกี่เดือน?",c:["4 เดือน","6 เดือน","8 เดือน","10 เดือน"],a:2,e:"แดดอ้อมใต้ 8 เดือน (ก.ย.–เม.ย.) อ้อมเหนือ 4 เดือน (พ.ค.–ส.ค.)"},
{q:"มุมแดดทางนอนเรียกว่าอะไร?",c:["Altitude","Azimuth","Declination","Zenith"],a:1,e:"Azimuth = มุมทางนอน, Altitude = มุมทางตั้ง"},
{q:"วันที่ 21 มิถุนายน คือวันอะไร?",c:["Winter Solstice","Vernal Equinox","Summer Solstice","Autumnal Equinox"],a:2,e:"21 มิ.ย. = Summer Solstice กลางวันยาวที่สุด"},
{q:"ทิศใดที่ร้อนที่สุดและต้องใช้แผงบังแดดทั้งทางตั้งและทางนอน?",c:["ทิศเหนือ","ทิศใต้","ทิศตะวันออก","ทิศตะวันตก"],a:3,e:"ทิศตะวันตกรับแดดช่วงบ่าย ร้อนที่สุด ต้องบังแดดสองทิศทาง"},
{q:"ทิศเหนือควรออกแบบแผงบังแดดอย่างไร?",c:["แผงบังแดดทางนอน","แผงบังแดดทางตั้ง","แผงบังแดดสองทิศ","ไม่จำเป็นต้องมีแผงบังแดด"],a:3,e:"ทิศเหนือได้แสงธรรมชาติมีคุณภาพ ไม่จำเป็นต้องมีแผงบังแดด"},
{q:"ภาวะน่าสบาย (Thermal Comfort) อยู่ที่อุณหภูมิประมาณเท่าใด?",c:["15–20°C","21–26°C","27–32°C","18–30°C"],a:1,e:"ภาวะน่าสบายที่อุณหภูมิ 21–26°C และความชื้นสัมพัทธ์ 30–60%"},
{q:"ความชื้นสัมพัทธ์ที่เหมาะสมในภาวะน่าสบายคือเท่าใด?",c:["10–30%","30–60%","60–80%","80–100%"],a:1,e:"ความชื้นสัมพัทธ์ที่น่าสบายคือ 30–60%"},
{q:"ทิศใดรับแดดช่วงเช้าและใช้แผงบังแดดทางตั้ง?",c:["ทิศเหนือ","ทิศใต้","ทิศตะวันออก","ทิศตะวันตก"],a:2,e:"ทิศตะวันออกรับแดดช่วงเช้า ใช้แผงบังแดดทางตั้ง"},
// หมวด: อาคารเขียว
{q:"มาตรฐานอาคารเขียวของไทยคือ?",c:["LEED","BREEAM","TREES","DGNB"],a:2,e:"TREES = Thai's Rating of Energy and Environmental Sustainability"},
{q:"มาตรฐานอาคารสุขภาวะของไทยคือ?",c:["WELL","Fitwel","SOOK","TREES"],a:2,e:"SOOK คือมาตรฐานอาคารสุขภาวะของไทย"},
{q:"GWP ย่อมาจากอะไร?",c:["Global Warming Potential","General Waste Protocol","Green Work Plan","Global Water Pollution"],a:0,e:"GWP = Global Warming Potential ค่าศักยภาพทำให้เกิดภาวะโลกร้อนใน 100 ปี"},
{q:"ก๊าซ CH4 มีค่า GWP เท่าใด?",c:["1","21","310","10900"],a:1,e:"CH4 มี GWP = 21 (เทียบกับ CO2=1, N2O=310, CFC=10900)"},
{q:"สารทำความเย็น R-32 มีค่า GWP เท่าใด?",c:["1","675","1810","2088"],a:1,e:"R-32 มี GWP = 675 (น้อยกว่า R-22 และ R-410A)"},
{q:"Embodied Carbon คืออะไร?",c:["คาร์บอนจากการใช้พลังงานอาคาร","คาร์บอนจากวัสดุและการก่อสร้าง","คาร์บอนจากผู้ใช้อาคาร","คาร์บอนจากระบบปรับอากาศ"],a:1,e:"Embodied Carbon = คาร์บอนจากวัสดุและกระบวนการก่อสร้าง"},
// หมวด: IAQ
{q:"VOCs ย่อมาจากอะไร?",c:["Visible Organic Compounds","Volatile Organic Compounds","Variable Output Controls","Ventilation Output Capacity"],a:1,e:"VOCs = สารอินทรีย์ระเหย พบในกาว สี แลคเกอร์ ทินเนอร์"},
{q:"ไม้ชนิดใดมีค่า VOCs ต่ำที่สุด?",c:["ไม้อัด","ไม้ MDF","ไม้เอ็นจิเนียร์","ไม้จริงแผ่นตัน"],a:3,e:"ไม้จริงแผ่นตันไม่มีการประกบกาว จึงมี VOCs ต่ำ"},
{q:"ฟิลเตอร์เกรดสูงสุดที่ใช้ในโรงพยาบาลเรียกว่า?",c:["MERV13","MERV14","HEPA","ULPA"],a:2,e:"HEPA คือฟิลเตอร์เกรดสูงสุด ใช้ในโรงพยาบาล"},
{q:"ห้องผ่าตัดควรเป็นห้องแรงดันอากาศแบบใด?",c:["Negative Pressure","Positive Pressure","Neutral Pressure","Variable Pressure"],a:1,e:"ห้องสะอาด เช่น ห้องผ่าตัด ควรเป็น Positive Pressure"},
{q:"ERV ในระบบ IAQ ทำหน้าที่อะไร?",c:["กรองฝุ่น PM2.5","เพิ่มอากาศบริสุทธิ์สำหรับระบบปรับอากาศทั่วไป","ดูดอากาศเสียออก","ฆ่าเชื้อโรคด้วย UV"],a:1,e:"ERV = Energy Recovery Ventilator เติมอากาศบริสุทธิ์สำหรับระบบ Split type"},
// หมวด: เรือนไทย
{q:"เรือนเครื่องผูกทำจากวัสดุอะไร?",c:["ไม้เนื้อแข็ง","ไม้ไผ่","ปูนและไม้","คอนกรีต"],a:1,e:"เรือนเครื่องผูก = เรือนชาวบ้าน ทำจากไม้ไผ่"},
{q:"เรือนเครื่องสับทำจากวัสดุอะไร?",c:["ไม้ไผ่","ไม้เนื้อแข็ง","คอนกรีต","ปูน"],a:1,e:"เรือนเครื่องสับ = เรือนผู้มีฐานะ ทำจากไม้เนื้อแข็ง"},
{q:"พื้นที่เปลี่ยนผ่านเข้าสู่เรือนไทยเรียกว่าอะไร?",c:["ชาน","เติ๋น","เกย","พาไล"],a:3,e:"พาไล = พื้นที่เปลี่ยนผ่านเข้าสู่เรือน"},
{q:"ไม้ที่แทงทะลุเสาทำหน้าที่แทนคานในเรือนไทยเรียกว่า?",c:["รา","รอด","พรึง","ฝักมะขาม"],a:1,e:"รอด = ไม้แทงทะลุเสา ทำหน้าที่แทนคาน"},
{q:"ฝักมะขามในเรือนไทยทำหน้าที่อะไร?",c:["รัดเสาส่วนติดพื้น","รับพื้นตรงเสาที่รอดไม่รองรับ","แทนคาน","รองรับหลังคา"],a:1,e:"ฝักมะขาม = เพิ่มมาเพื่อรับพื้นตรงเสาที่รอดไม่สามารถรองรับได้"},
{q:"เรือนภาคเหนือเรียกว่าอะไร?",c:["เฮือน","เรือนกาแล","เรือนเครื่องก่อ","เรือนปั้นหยา"],a:1,e:"เรือนกาแล = เรือนพื้นถิ่นภาคเหนือ"},
{q:"พื้นที่เปิดโล่งของเรือนภาคเหนือเรียกว่าอะไร?",c:["พาไล","เกย","เติ๋น","ชาน"],a:2,e:"เติ๋น = พื้นที่เปิดโล่งของเรือนกาแลภาคเหนือ"},
{q:"เรือนภาคอีสานมีพื้นที่กึ่งในกึ่งนอกเรียกว่าอะไร?",c:["เติ๋น","พาไล","เกย","ชาน"],a:2,e:"เกย = พื้นที่กึ่งภายในภายนอกของเรือนภาคอีสาน"},
{q:"เรือนไทยภาคใต้มุสลิมมีลักษณะพิเศษอย่างไร?",c:["ใต้ถุนสูงมาก","หน้าต่างน้อย","แยกโซนและทางขึ้นชาย-หญิง","ผนังเป็นฝาไหล"],a:2,e:"เรือนมุสลิมภาคใต้มีการแยกโซนและทางขึ้นชาย-หญิง"},
// หมวด: Universal Design
{q:"ทางลาดสำหรับผู้พิการต้องมีสัดส่วนเท่าใด?",c:["1:6","1:8","1:10","1:12"],a:3,e:"ทางลาดผู้พิการ = 1:12 มีชานพักทุก 6 เมตร"},
{q:"ลิฟต์ผู้พิการต้องมีขนาดห้องภายในอย่างน้อยเท่าใด?",c:["1.20×1.40 ม.","1.40×1.60 ม.","1.50×1.80 ม.","1.60×2.00 ม."],a:1,e:"ลิฟต์ผู้พิการต้องมีขนาดภายในอย่างน้อย 1.40×1.60 ม."},
{q:"ช่องประตูสำหรับผู้พิการต้องกว้างไม่ต่ำกว่าเท่าใด?",c:["76 ซม.","80 ซม.","86 ซม.","90 ซม."],a:2,e:"ช่องประตูผู้พิการกว้างไม่ต่ำกว่า 86 ซม."},
{q:"ห้องน้ำผู้พิการต้องมีพื้นที่ว่างให้รถเข็นหมุนตัวได้ เส้นผ่านศูนย์กลางไม่น้อยกว่าเท่าใด?",c:["1.20 ม.","1.35 ม.","1.50 ม.","1.80 ม."],a:2,e:"ห้องน้ำผู้พิการต้องมี space หมุนรถเข็น เส้นผ่านศูนย์กลางไม่น้อยกว่า 1.50 ม."},
{q:"โถส้วมผู้พิการต้องสูงจากพื้นเท่าใด?",c:["30–35 ซม.","40–45 ซม.","45–50 ซม.","50–55 ซม."],a:1,e:"โถส้วมผู้พิการสูง 40–45 ซม. จากพื้น"},
{q:"โรงแรมต้องมีห้องพักสำหรับผู้พิการอย่างน้อยเท่าใด?",c:["1 ห้องต่อทุก 5 ห้อง","อย่างน้อยชั้นละ 1 ห้อง","1 ห้องต่อทุก 20 ห้อง","2 ห้องต่ออาคาร"],a:1,e:"โรงแรมต้องมีห้องพักผู้พิการอย่างน้อยชั้นละ 1 ห้อง"},
{q:"พื้นผิวต่างสัมผัส (แบบเตือน) ต้องติดตั้งบริเวณด้านหน้าบันไดห่างเท่าใด?",c:["ทุกชั้น","ทุก 2 ชั้น","เฉพาะชั้นล่าง","ไม่กำหนด"],a:0,e:"พื้นผิวต่างสัมผัสต้องติดทั้งขึ้นและลง ด้านหน้าบันไดทุกชั้น"},
// หมวด: งานก่อสร้าง/วัสดุ

Q.splice(150); let cur=0,score=0,wrong=[],answered=false;

function startQuiz(){
  cur=0;score=0;wrong=[];answered=false;
  document.getElementById('splash').style.display='none';
  document.getElementById('result').style.display='none';
  document.getElementById('quiz').style.display='block';
  loadQ();
}

function loadQ(){
  const q=Q[cur];
  answered=false;
  document.getElementById('qcount').textContent=`ข้อ ${cur+1} / 150`;
  document.getElementById('scoretrack').textContent=`คะแนน: ${score}`;
  document.getElementById('pbar').style.width=`${(cur/Q.length)*100}%`;
  document.getElementById('qnum').textContent=`ข้อที่ ${cur+1}`;
  document.getElementById('qtext').textContent=q.q;
  document.getElementById('feedback').style.display='none';
  document.getElementById('btnNext').style.display='none';
  const labels=['A','B','C','D'];
  document.getElementById('choices').innerHTML=q.c.map((c,i)=>
    `<button class="choice" onclick="pick(${i})"><span class="choice-label">${labels[i]}</span><span>${c}</span></button>`
  ).join('');
}

function pick(i){
  if(answered)return;
  answered=true;
  const q=Q[cur];
  const btns=document.querySelectorAll('.choice');
  btns.forEach(b=>b.classList.add('locked'));
  btns[i].classList.add(i===q.a?'correct':'wrong');
  btns[q.a].classList.add('correct');
  if(i===q.a){score++;}else{wrong.push(cur);}
  const fb=document.getElementById('feedback');
  fb.textContent=q.e;
  fb.style.display='block';
  document.getElementById('btnNext').style.display='inline-block';
  document.getElementById('scoretrack').textContent=`คะแนน: ${score}`;
}

function nextQ(){
  cur++;
  if(cur>=Q.length){showResult();return;}
  loadQ();
}

function showResult(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('result').style.display='block';
  const pct=Math.round((score/150)*100);
  const pass=pct>=60;
  document.getElementById('sCorrect').textContent=score;
  document.getElementById('sWrong').textContent=Q.length-score;
  document.getElementById('sPct').textContent=pct+'%';
  document.getElementById('scoreText').textContent=pct+'%';
  const circ=439.8;
  setTimeout(()=>{
    document.getElementById('ringFill').style.strokeDashoffset=circ-(circ*pct/100);
  },100);
  document.getElementById('resultContent').innerHTML=pass?
    `<div class="shirt-badge">👔</div><div class="result-title">คุณคือสถาปนิก!</div><div class="result-msg">รับเสื้อไปได้เลย 🎉<br>คะแนน ${score}/150 (${pct}%) ผ่านเกณฑ์ 60%</div>`:
    `<div class="shirt-badge">📐</div><div class="result-title">ยังต้องฝึกเพิ่มอีกนิด</div><div class="result-msg">คะแนน ${score}/150 (${pct}%)<br>ต้องได้ 60% ขึ้นไปถึงจะเป็นสถาปนิก<br>ลองใหม่อีกครั้งนะ!</div>`;
}

function reviewWrong(){
  if(wrong.length===0){alert('ไม่มีข้อที่ตอบผิด! 🎉');return;}
  const list=wrong.map(i=>`ข้อ ${i+1}: ${Q[i].q}\n→ ${Q[i].c[Q[i].a]}`).join('\n\n');
  alert('ข้อที่ตอบผิด:\n\n'+list);
}
</script>
